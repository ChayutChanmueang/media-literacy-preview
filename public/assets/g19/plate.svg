<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- G19 table decoration: an empty white plate seen from straight above. Plate centre (120,116), r 106. -->
  <defs>
    <radialGradient id="rim" cx="45%" cy="40%" r="62%">
      <stop offset="0.62" stop-color="#FFFFFF" />
      <stop offset="0.9" stop-color="#F1F5F9" />
      <stop offset="1" stop-color="#D5DCE5" />
    </radialGradient>
    <radialGradient id="well" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.8" stop-color="#F6F8FB" />
      <stop offset="1" stop-color="#E4E9F0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3C230F" flood-opacity="0.4" />
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="120" cy="116" r="106" fill="url(#rim)" stroke="#C7D0DB" stroke-width="2" />
  </g>
  <!-- thin blue band on the rim -->
  <circle cx="120" cy="116" r="94" fill="none" stroke="#93C5FD" stroke-width="3" opacity="0.8" />
  <!-- the well: slightly sunken, lit from the top-left -->
  <circle cx="120" cy="116" r="70" fill="url(#well)" stroke="#DCE3EC" stroke-width="2" />
  <path d="M68 92 A58 58 0 0 1 120 58" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M34 80 A92 92 0 0 1 88 28" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9" />
</svg>
