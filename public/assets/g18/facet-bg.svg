<svg xmlns="http://www.w3.org/2000/svg" width="450" height="600" viewBox="0 0 450 600">
  <!-- G18 play-screen background tile: light grey low-poly facets — each 225×300 cell is a flat pyramid seen
       from above (4 triangles meeting at its centre), each face a slightly different grey. Repeats seamlessly. -->
  <defs>
    <g id="cell">
      <polygon points="0,0 225,0 112.5,150" fill="#ECEEF0" />
      <polygon points="225,0 225,300 112.5,150" fill="#E2E4E7" />
      <polygon points="225,300 0,300 112.5,150" fill="#E6E8EB" />
      <polygon points="0,300 0,0 112.5,150" fill="#E9EBED" />
    </g>
    <!-- mirrored cell, so neighbouring pyramids catch the light from the other side -->
    <g id="cellAlt">
      <polygon points="0,0 225,0 112.5,150" fill="#E7E9EC" />
      <polygon points="225,0 225,300 112.5,150" fill="#EAECEE" />
      <polygon points="225,300 0,300 112.5,150" fill="#E3E5E8" />
      <polygon points="0,300 0,0 112.5,150" fill="#E5E7EA" />
    </g>
  </defs>
  <use href="#cell" />
  <use href="#cellAlt" x="225" />
  <use href="#cellAlt" y="300" />
  <use href="#cell" x="225" y="300" />
</svg>
