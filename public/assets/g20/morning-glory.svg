<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- ผักบุ้ง (water spinach) bunch for G20/G20K: long stems tied with a red band, narrow arrow-shaped leaves fanning
     out at the top. Flat like the kitchen scene (jars, bowl, awning): no outlines, two-tone shapes and soft white
     shine strips. Drawn upright, then tilted so the cut stem ends point to the lower left. -->
<defs>
  <!-- one leaf, base at (0,0), pointing up: full in the middle, rounded tip, curving gently to the right (mirror with
       scale(-1 1) to curve left); lit left half, shaded right half, faint light midrib -->
  <g id="leaf">
    <path d="M0 0 C9 -8 11 -24 5 -33 Q3 -35.5 1 -33.5 C-6 -25 -8 -9 0 0 Z" fill="#5E9E4A"/>
    <path d="M0 0 C-8 -9 -6 -25 1 -33.5 Q3 -18 0 0 Z" fill="#7DB862"/>
    <path d="M0 -3 Q2.6 -17 2 -29" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- back leaf: a shade darker so the bunch has depth without outlines -->
  <g id="leaf-back">
    <path d="M0 0 C9 -8 11 -24 5 -33 Q3 -35.5 1 -33.5 C-6 -25 -8 -9 0 0 Z" fill="#4C8A3E"/>
    <path d="M0 0 C-8 -9 -6 -25 1 -33.5 Q3 -18 0 0 Z" fill="#62A24E"/>
  </g>
</defs>
<g transform="rotate(24 50 54) translate(2 2) scale(0.96)">
  <!-- back leaves (behind the stems) -->
  <use href="#leaf-back" transform="translate(38 50) rotate(-74) scale(-0.78 0.78)"/>
  <use href="#leaf-back" transform="translate(62 50) rotate(78) scale(0.82)"/>
  <use href="#leaf-back" transform="translate(43 44) rotate(-36) scale(-0.92 0.92)"/>
  <use href="#leaf-back" transform="translate(57 44) rotate(42) scale(0.88)"/>

  <!-- stems: flat, a shaded edge under a lighter body -->
  <g stroke="#6FA552" stroke-width="6.5" stroke-linecap="round" fill="none">
    <path d="M41 92 Q43 80 46 72 Q44 60 36 50"/>
    <path d="M47 94 Q48 82 49 72 Q48 58 45 44"/>
    <path d="M53 94 Q52 82 51 72 Q52 58 55 44"/>
    <path d="M59 92 Q57 80 54 72 Q56 60 64 50"/>
  </g>
  <g stroke="#9ACB76" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M40.4 91 Q42.4 80 45.4 72 Q43.4 60 35.6 50.6"/>
    <path d="M46.4 93 Q47.4 82 48.4 72 Q47.4 58 44.6 44.8"/>
    <path d="M52.4 93 Q51.4 82 50.4 72 Q51.4 58 54.4 44.8"/>
    <path d="M58.4 91 Q56.4 80 53.4 72 Q55.4 60 63.2 50.6"/>
  </g>
  <!-- shine strip down the stems, like the jars' -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M39.9 88 Q41.6 79 44.4 72.5"/>
    <path d="M45.9 90 Q46.6 81 47.4 72.5"/>
    <path d="M51.9 90 Q51 81 49.9 72.5"/>
    <path d="M57.8 88 Q56.3 79 53.1 72.5"/>
  </g>
  <!-- cut stem ends: pale flesh with a soft darker ring -->
  <g>
    <ellipse cx="41" cy="92.5" rx="3.3" ry="2.2" fill="#6FA552"/>
    <ellipse cx="47" cy="94.5" rx="3.3" ry="2.2" fill="#6FA552"/>
    <ellipse cx="53" cy="94.5" rx="3.3" ry="2.2" fill="#6FA552"/>
    <ellipse cx="59" cy="92.5" rx="3.3" ry="2.2" fill="#6FA552"/>
    <ellipse cx="41" cy="92.5" rx="2.2" ry="1.4" fill="#D8ECC0"/>
    <ellipse cx="47" cy="94.5" rx="2.2" ry="1.4" fill="#D8ECC0"/>
    <ellipse cx="53" cy="94.5" rx="2.2" ry="1.4" fill="#D8ECC0"/>
    <ellipse cx="59" cy="92.5" rx="2.2" ry="1.4" fill="#D8ECC0"/>
  </g>

  <!-- front leaves -->
  <use href="#leaf" transform="translate(36 50) rotate(-52) scale(-1 1)"/>
  <use href="#leaf" transform="translate(64 50) rotate(50) scale(0.97)"/>
  <use href="#leaf" transform="translate(45 44) rotate(-12) scale(-1.03 1.03)"/>
  <use href="#leaf" transform="translate(55 44) rotate(14)"/>

  <!-- red band tying the bunch: the jars' red, darker lower half, soft shine -->
  <rect x="39.5" y="68" width="21" height="9" rx="3.5" fill="#E46C5B"/>
  <path d="M39.5 72.5 H60.5 V73.5 A3.5 3.5 0 0 1 57 77 H43 A3.5 3.5 0 0 1 39.5 73.5 Z" fill="#C9533F"/>
  <path d="M42.5 70.4 H54" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>
</g>
</svg>
