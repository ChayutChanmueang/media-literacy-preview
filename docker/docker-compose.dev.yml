version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/DockerDev
    container_name: media-literacy-web-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - ENABLE_DEV_HUB=${ENABLE_DEV_HUB:-true}
      - NEXT_PUBLIC_ENABLE_DEV_HUB=${NEXT_PUBLIC_ENABLE_DEV_HUB:-true}
      - NODE_ENV=production
