# SPA rewrite เทียบเท่า vercel.json ("/(.*)" -> "/index.html")
# access_log/error_log ชี้ path เดิมของ nginx:alpine (/var/log/nginx/*)
# ซึ่งถูก mount เป็น named volume ใน docker-compose.portainer.yml เพื่อกันข้อมูล log หายเวลา container ถูกลบ/redeploy

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
