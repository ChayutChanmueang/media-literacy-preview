# GitLab CI/CD — รู้ทันสื่อ Interactive (media-literacy)
#
# Pipeline:  check (lint / typecheck / unit test) → build-sonar (SonarQube) → build (next build) → docker (build + push image) → deploy (Portainer)
#
# ตัวแปรที่ต้องตั้งที่ Settings > CI/CD > Variables (ตั้ง Masked + Protected ทุกตัวที่เป็น secret):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  (ไม่บังคับ) ถ้าตั้งไว้ จะ push image ไป Docker Hub ด้วย
#                                         (Portainer ของ CAMT ดึง image จาก Docker Hub — ดู docs/wiki/deploy-camt/docker-portainer-guide.md)
#   DOCKERHUB_REPO                        (ไม่บังคับ) ค่า default คือ naplabstudio/media-literacy
#   PORTAINER_WEBHOOK_URL                 (ไม่บังคับ) webhook ของ stack/service production ใน Portainer
#   PORTAINER_DEV_WEBHOOK_URL             (ไม่บังคับ) webhook ของเครื่อง dev
#   SONAR_HOST_URL / SONAR_TOKEN          URL ของ SonarQube และ token (Masked) สำหรับ job build-sonar
#
# ไม่ต้องใส่ DATABASE_URL จริงใน CI เพราะตอน build ใช้ค่า placeholder (ไม่ได้ต่อฐานข้อมูลจริง)
# DATABASE_URL จริงตั้งที่ Portainer > Stack > Environment variables เท่านั้น

workflow:
  rules:
    # ถ้ามี MR เปิดอยู่ ให้รันแค่ pipeline ของ MR ไม่ต้องรัน branch pipeline ซ้ำ
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - build-sonar
  - build
  - docker
  - deploy

variables:
  NODE_IMAGE: node:24-alpine # ต้องตรงกับ base image ใน docker/Dockerfile
  NEXT_TELEMETRY_DISABLED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # route module ตรวจรูปแบบ DATABASE_URL ตอน next build — ค่านี้ไม่ได้ใช้ต่อฐานข้อมูลจริง
  BUILD_DATABASE_URL: postgresql://build:build@localhost:5432/build
  DOCKERHUB_REPO: naplabstudio/media-literacy
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # ที่เก็บ cache ของ SonarQube analysis

# ---------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull
  before_script:
    # --legacy-peer-deps ให้ตรงกับ docker/Dockerfile
    - npm ci --legacy-peer-deps --no-audit --no-fund --prefer-offline

.docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        export PUSH_DOCKERHUB=1
      fi
  script:
    # IMAGE_TAGS และ DOCKERFILE กำหนดในแต่ละ job
    - docker pull "$CI_REGISTRY_IMAGE:$CACHE_TAG" || true
    - |
      TAG_ARGS=""
      for t in $IMAGE_TAGS; do
        TAG_ARGS="$TAG_ARGS -t $CI_REGISTRY_IMAGE:$t"
        if [ -n "$PUSH_DOCKERHUB" ]; then TAG_ARGS="$TAG_ARGS -t $DOCKERHUB_REPO:$t"; fi
      done
      docker build \
        -f "$DOCKERFILE" \
        --cache-from "$CI_REGISTRY_IMAGE:$CACHE_TAG" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        $TAG_ARGS .
    - |
      for t in $IMAGE_TAGS; do
        docker push "$CI_REGISTRY_IMAGE:$t"
        if [ -n "$PUSH_DOCKERHUB" ]; then docker push "$DOCKERHUB_REPO:$t"; fi
      done
      echo "Pushed tags: $IMAGE_TAGS"

.portainer_webhook:
  image: curlimages/curl:latest
  script:
    # WEBHOOK_VAR = ชื่อตัวแปรที่เก็บ URL (อ่านผ่าน shell เพื่อให้ตัวแปรที่ยังไม่ได้ตั้งกลายเป็นค่าว่างจริง)
    - |
      eval "WEBHOOK_URL=\"\${$WEBHOOK_VAR:-}\""
      if [ -z "$WEBHOOK_URL" ]; then
        echo "ยังไม่ได้ตั้ง webhook ใน CI/CD Variables — ให้กด 'Update the stack > Re-pull image and redeploy' ใน Portainer เอง"
        exit 0
      fi
      curl --fail --silent --show-error -X POST "$WEBHOOK_URL"
      echo "เรียก Portainer webhook แล้ว"

# ---------------------------------------------------------------------------
# check
# ---------------------------------------------------------------------------

typecheck:
  extends: .node
  stage: check
  needs: []
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push # job นี้เป็นตัวเติม npm cache ให้ job อื่น
  script:
    - npx tsc --noEmit

lint:
  extends: .node
  stage: check
  needs: []
  script:
    - npm run lint

unit-test:
  extends: .node
  stage: check
  needs: []
  script:
    - npx vitest run --reporter=default --reporter=junit --outputFile=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
    expire_in: 1 week
  # TODO: ตอนนี้ unit test พัง 2 ข้อ (videos.test.ts, leaderboard-player.test.ts) — แก้แล้วให้ลบ allow_failure ออก
  allow_failure: true

# ---------------------------------------------------------------------------
# build-sonar — SonarQube analysis (ตั้งค่าโปรเจกต์อยู่ที่ sonar-project.properties)
# ---------------------------------------------------------------------------

build-sonar:
  stage: build-sonar
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  needs: []
  variables:
    GIT_DEPTH: "0" # SonarQube ต้องใช้ git history เต็มเพื่อวิเคราะห์ branch / blame
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_BRANCH == 'development' # branch ที่ทีมใช้จริงในโปรเจกต์นี้

# ---------------------------------------------------------------------------
# build — ตรวจว่า next build ผ่าน ทั้งใน MR และทุก branch
# ---------------------------------------------------------------------------

next-build:
  extends: .node
  stage: build
  needs: []
  variables:
    DATABASE_URL: $BUILD_DATABASE_URL
    # ห้ามตั้ง NODE_ENV=production ตรงนี้: npm ci จะข้าม devDependencies (typescript)
    # แล้ว next build จะ resolve alias "@/..." จาก tsconfig ไม่ได้ — next build ตั้ง production ให้เองอยู่แล้ว
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm/]
      policy: pull
    - key: next-cache-$CI_COMMIT_REF_SLUG
      paths: [.next/cache/]
  script:
    - npm run build

# E2E (Playwright) ต้องมี dev server + เบราว์เซอร์ ให้กดรันเองเมื่อต้องการ
e2e:
  image: mcr.microsoft.com/playwright:v1.61.1-noble # ต้องตรงกับเวอร์ชัน @playwright/test ใน package-lock.json
  stage: build
  needs: []
  variables:
    CI: "true"
    DATABASE_URL: $BUILD_DATABASE_URL
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull
  before_script:
    - npm ci --legacy-peer-deps --no-audit --no-fund --prefer-offline
  script:
    - npx playwright test
  artifacts:
    when: on_failure
    paths: [test-results/]
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH
      when: manual
  allow_failure: true

# ---------------------------------------------------------------------------
# docker — build + push image
#   main         → docker/Dockerfile  → :latest, :<short-sha>
#   development  → docker/DockerDev   → :dev, :dev-<short-sha>  (มี Dev Hub)
#   tag vX.Y.Z   → docker/Dockerfile  → :vX.Y.Z
# ---------------------------------------------------------------------------

docker:production:
  extends: .docker
  stage: docker
  needs: [typecheck, next-build]
  variables:
    DOCKERFILE: docker/Dockerfile
    CACHE_TAG: latest
    IMAGE_TAGS: "latest $CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker:dev:
  extends: .docker
  stage: docker
  needs: [typecheck, next-build]
  variables:
    DOCKERFILE: docker/DockerDev
    CACHE_TAG: dev
    IMAGE_TAGS: "dev dev-$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "development"

docker:release:
  extends: .docker
  stage: docker
  needs: [typecheck, next-build]
  variables:
    DOCKERFILE: docker/Dockerfile
    CACHE_TAG: latest
    IMAGE_TAGS: "$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ---------------------------------------------------------------------------
# deploy — เรียก Portainer webhook ให้ re-pull image
#   production ต้องกดรันเอง (manual) — กันการ deploy ช่วงที่กำลังอบรมอยู่หน้างาน
# ---------------------------------------------------------------------------

deploy:production:
  extends: .portainer_webhook
  stage: deploy
  needs: [docker:production]
  variables:
    WEBHOOK_VAR: PORTAINER_WEBHOOK_URL
  environment:
    name: production
  resource_group: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: true # ไม่ให้ pipeline ค้างสถานะ blocked ระหว่างรอกด deploy

deploy:dev:
  extends: .portainer_webhook
  stage: deploy
  needs: [docker:dev]
  variables:
    WEBHOOK_VAR: PORTAINER_DEV_WEBHOOK_URL
  environment:
    name: development
  resource_group: development
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
